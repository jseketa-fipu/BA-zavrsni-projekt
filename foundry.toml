[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[fmt]
line_length = 100

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
